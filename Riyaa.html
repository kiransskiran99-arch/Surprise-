<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Romantic Surprise</title>
  <!-- Tailwind CDN (closed properly) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; }
    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 24px;
      color: #ff4d6d;
      animation: floatUp 4s linear infinite;
      opacity: 0.9;
      pointer-events: none;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 0.9; }
      100% { transform: translateY(-120vh) scale(1.6); opacity: 0; }
    }
    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }
    .petal {
      position: fixed;
      top: -40px;
      pointer-events: none;
      font-size: 26px;
      animation-name: fall;
      animation-timing-function: linear;
    }
    .heartbeat {
      animation: heartbeat 1.2s infinite;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    @keyframes heartbeat {
      0% { transform: scale(1); }
      25% { transform: scale(1.12); }
      40% { transform: scale(1); }
      60% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    /* simple envelope open animation */
    .envelope {
      width: 220px;
      height: 140px;
      position: relative;
      perspective: 800px;
      cursor: pointer;
    }
    .env-body {
      position: absolute;
      width: 100%;
      height: 60%;
      background: linear-gradient(180deg,#fef2f2,#fee2e2);
      bottom: 0;
      border-radius: 6px;
      display:flex;align-items:center;justify-content:center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    }
    .env-flap {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      transform-origin: top center;
      background: linear-gradient(180deg,#fecaca,#fda4af);
      border-radius: 6px;
      transform: rotateX(0deg);
      transition: transform 700ms cubic-bezier(.2,.9,.3,1);
      display:flex;align-items:center;justify-content:center;
    }
    .env-open .env-flap { transform: rotateX(-180deg); }
    .hidden { display:none; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-pink-200 via-rose-100 to-purple-200 p-6">
  <!-- Background music (place music.mp3 next to this file) -->
  <audio id="bgmusic" src="music.mp3" autoplay loop></audio>

  <div id="app" class="w-full max-w-xl bg-white/70 backdrop-blur-md rounded-2xl shadow-2xl p-8 md:p-12 text-center"></div>

  <script>
    // Simple state machine for pages
    let step = 1;
    let choice = null;

    function render() {
      const app = document.getElementById('app');

      if (step === 1) {
        app.innerHTML = `
          <h1 class="text-3xl md:text-4xl font-extrabold leading-tight text-rose-700">Are you ready for the surprise, <span class="text-pink-600">riyaa</span>?</h1>
          <p class="mt-4 text-sm md:text-base text-rose-600/80">A little moment is waiting — choose honestly 😊</p>

          <div class="mt-8 flex justify-center gap-4">
            <button onclick="next('yes')" class="inline-flex items-center gap-3 px-6 py-3 rounded-xl shadow hover:scale-105 transition bg-rose-600 text-white font-semibold">👍 Yes</button>
            <button onclick="next('no')" class="inline-flex items-center gap-3 px-6 py-3 rounded-xl shadow hover:scale-105 transition bg-white/80 border border-rose-200 text-rose-700 font-semibold">😔 No</button>
          </div>

          <div class="mt-6 text-xs text-rose-500/70">Your answer is just between us — honest and kind 💕</div>
        `;
      }

      else if (step === 2) {
        app.innerHTML = `
          <h2 class="text-2xl md:text-3xl font-bold text-rose-700">Be honest</h2>
          <p class="mt-3 text-rose-600/85 text-base">Be honest and choose what your heart says.</p>

          <div class="mt-8 flex justify-center gap-4">
            <button onclick="step=3; render();" class="inline-flex items-center gap-3 px-6 py-3 rounded-xl shadow hover:scale-105 transition bg-pink-500 text-white font-semibold">❤️ Yes</button>
            <button onclick="alert('Thank you for being honest. 😔')" class="inline-flex items-center gap-3 px-6 py-3 rounded-xl shadow hover:scale-105 transition bg-white/80 border border-rose-200 text-rose-700 font-semibold">😔 No</button>
          </div>

          <div class="mt-6 flex justify-between items-center text-sm text-rose-500/70">
            <button onclick="goBack()" class="underline text-rose-500/80">Go back</button>
            <div class="italic">Made with 💖</div>
          </div>
        `;
      }

      else if (step === 3) {
        app.innerHTML = `
          <h2 class="text-2xl md:text-3xl font-bold text-rose-700">Do you like me?</h2>

          <div class="mt-8 flex justify-center gap-4">
            <button onclick="step=4; render();" class="inline-flex items-center gap-3 px-6 py-3 rounded-xl shadow hover:scale-110 transition bg-pink-500 text-white font-semibold">❤️ Yes</button>
            <button onclick="alert('Oh… okay 😔')" class="inline-flex items-center gap-3 px-6 py-3 rounded-xl shadow hover:scale-110 transition bg-white/80 border border-rose-200 text-rose-700 font-semibold">😔 No</button>
          </div>

          <div class="mt-6 flex justify-between items-center text-sm text-rose-500/70">
            <button onclick="goBack()" class="underline text-rose-500/80">Go back</button>
            <div class="italic">Made with 💖</div>
          </div>
        `;
      }

      else if (step === 4) {
        app.innerHTML = `
          <div class="animate-pulse">
            <h2 class="text-4xl md:text-5xl font-extrabold text-rose-700">I Love You ❤️</h2>
          </div>

          <p class="mt-6 text-xl text-rose-600 italic">"In your smile, I find something more beautiful than the stars."</p>

          <div class="mt-10 flex justify-center">
            <div class="bg-white/80 px-6 py-3 rounded-2xl shadow-xl text-rose-600 font-semibold text-lg animate-bounce">You mean the world to me 💘</div>
          </div>

          <button onclick="step=5; render();" class="mt-10 px-6 py-3 bg-rose-600 text-white rounded-xl shadow hover:scale-105 transition">There is more ❤️</button>

          <div class="mt-10 text-sm text-rose-500/70 italic">Forever yours 💞</div>
        `;
      }

      else if (step === 5) {
        app.innerHTML = `
          <div class="flex flex-col items-center">
            <div id="envelope" class="envelope" onclick="openEnvelope()">
              <div class="env-flap">✉️</div>
              <div class="env-body"><div style="font-size:20px;">🔒</div></div>
            </div>
            <p class="mt-4 text-rose-700 font-semibold">Tap the envelope 💓</p>
          </div>
        `;
      }

      else if (step === 6) {
        app.innerHTML = `
          <div class="text-left text-rose-700 leading-relaxed">
            Riyaa, I just wanted to say this to you. I really fell for you the first time I saw you, and there was something in between us. I guess that God has planned something for us, and I wanted to say that I'll be there for you forever till my last breath.
            <br><br>I know this sounds a little over, but I really mean it. I really love you, and I just want you to be mine. Now the reply is with you — if you need time, then it's ok.
            <br><br>I really hope you loved this. Waiting for your reply.
            <br><br><strong>— From Kiran</strong>
          </div>

          <div class="mt-6">
            <textarea id="replyBox" placeholder="Your reply..." class="w-full p-3 rounded-xl border border-rose-300"></textarea>
            <div class="flex gap-3 mt-3 justify-center">
              <button onclick="saveReply()" class="px-6 py-2 bg-rose-600 text-white rounded-xl shadow hover:scale-105 transition">Send Reply 💌</button>
              <button onclick="clearReply()" class="px-6 py-2 bg-white border border-rose-300 rounded-xl">Clear</button>
            </div>
            <div id="status" class="mt-3 text-sm text-green-600"></div>
            <div class="mt-4 text-xs text-gray-600">(Your reply is saved locally in this browser. To let Kiran see it, give him this file or send the reply text.)</div>
          </div>

          <div class="mt-6">
            <button onclick="showAdmin()" class="text-sm underline text-rose-500">View reply (Kiran)</button>
          </div>
        `;
      }
    }

    function next(c) {
      choice = c;
      step = 2;
      render();
    }

    function goBack() {
      step = 1;
      choice = null;
      render();
    }

    // Envelope open flow + petals + animated open
    function openEnvelope() {
      const envelopeEl = document.getElementById('envelope');
      if (!envelopeEl) return;
      envelopeEl.classList.add('env-open');
      // small delay to allow flap animation then proceed
      setTimeout(() => {
        step = 6;
        render();
        createPetals(30);
      }, 700);
    }

    function createPetals(count = 20) {
      const music = document.getElementById('bgmusic');
      for (let i = 0; i < count; i++) {
        const petal = document.createElement('div');
        petal.className = 'petal';
        petal.innerText = '🌹';
        petal.style.left = Math.random() * (window.innerWidth - 40) + 'px';
        petal.style.top = (-40 - Math.random() * 200) + 'px';
        petal.style.animationDuration = (3 + Math.random() * 3) + 's';
        petal.style.opacity = (0.7 + Math.random() * 0.3);
        document.body.appendChild(petal);
        setTimeout(() => petal.remove(), 7000);
      }
    }

    function saveReply() {
      const reply = document.getElementById('replyBox').value;
      localStorage.setItem('riyaa_reply', reply);
      document.getElementById('status').innerText = 'Reply saved! You can read it anytime.';
    }

    function clearReply() {
      document.getElementById('replyBox').value = '';
      localStorage.removeItem('riyaa_reply');
      document.getElementById('status').innerText = 'Reply cleared.';
    }

    // Simple admin/viewer dialog so 'Kiran' can view saved reply on the same machine
    function showAdmin() {
      const stored = localStorage.getItem('riyaa_reply') || '';
      if (!stored) {
        alert('No reply saved yet.');
        return;
      }
      // show in a modal-like prompt
      const w = window.open('', '_blank', 'noopener');
      if (!w) {
        alert('Popup blocked. Please allow popups to view the reply in a new window.');
        return;
      }
      w.document.write(`<title>Riyaa's Reply</title><body style="font-family:system-ui;padding:24px;background:#fff"><h2>Reply from Riyaa</h2><pre style="white-space:pre-wrap">${escapeHtml(stored)}</pre><p><em>Saved locally in the browser.</em></p></body>`);
      w.document.close();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Floating hearts synced with music: spawn only when music playing and on step >=4
    function spawnHeart() {
      const music = document.getElementById('bgmusic');
      if (!music || music.paused || step < 4) return;
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.innerText = '❤️';
      heart.style.left = Math.random() * (window.innerWidth - 30) + 'px';
      heart.style.animationDuration = (3 + Math.random() * 2) + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 5000);
    }

    setInterval(spawnHeart, 700);

    // Initialize
    render();

  </script>
</body>
</html>
